name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdo-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build GDO-MT Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4

      - name: Checkout GDO source and embedded data
        uses: actions/checkout@v4
        with:
          repository: redatest/GDO
          ref: main
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter application
        run: |
          flutter create --platforms=android --org dz.sonelgaz --project-name gdo_mt_mobile build_app
          mkdir -p build_app/assets/gdo/assets
          cp source/index.html build_app/assets/gdo/index.html
          cp -R source/assets/. build_app/assets/gdo/assets/
          cp -R source/src build_app/assets/gdo/src
          cp pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/lib
          cp lib/main.dart build_app/lib/main.dart

      - name: Configure Android local HTTP access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '    <uses-permission android:name="android.permission.INTERNET"/>\\n    <application', 1)
          if "android:usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Resolve Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build_app/build/app/outputs/flutter-apk/app-release.apk dist/GDO-MT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDO-MT-Android-APK
          path: dist/GDO-MT.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: GDO-MT Android — build ${{ github.run_number }}
          body: |
            APK Android autonome de GDO-MT.
            Données réseau embarquées depuis redatest/GDO au moment de la compilation.
          files: dist/GDO-MT.apk
          make_latest: true

      - name: Update README with the published APK version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          build = os.environ["BUILD_NUMBER"]
          url = f"https://github.com/redatest/GDO-mobile-ap/releases/download/mobile-build-{build}/GDO-MT.apk"
          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          content = re.sub(
              r"releases/download/mobile-build-\\d+/GDO-MT\\.apk",
              f"releases/download/mobile-build-{build}/GDO-MT.apk",
              content,
              count=1,
          )
          content = re.sub(
              r"GDO-MT \\(build \\d+\\)",
              f"GDO-MT (build {build})",
              content,
              count=1,
          )
          content = re.sub(
              r"Version publiée : build \\d+\\.",
              f"Version publiée : build {build}. Ce lien est automatiquement actualisé après chaque nouvelle compilation réussie.",
              content,
              count=1,
          )
          path.write_text(content, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update README APK link for build ${BUILD_NUMBER}"
            git push
          fi
